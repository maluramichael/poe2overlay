name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      # The version in tauri.conf.json must match the tag (v0.2.0 -> 0.2.0).
      - name: Check version against tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('tauri.conf.json'))['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tauri.conf.json has $version, tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Build installers (NSIS setup.exe + MSI)
        run: npx --yes @tauri-apps/cli@2.12.1 build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi
