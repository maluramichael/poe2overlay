<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PoE2 Overlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="panel" hidden>
  <header id="bar">
    <span id="act"></span>
    <span id="levels"></span>
    <button id="prev" title="Zurück (Strg+Alt+Links)">&#9664;</button>
    <button id="next" title="Weiter (Strg+Alt+Rechts)">&#9654;</button>
    <button id="mini" title="Mini-Modus (Strg+Alt+C)">&#8211;</button>
  </header>
  <div id="current"></div>
  <ol id="upcoming"></ol>
  <p id="nolog" hidden>Client.txt nicht gefunden: Zonen werden nicht erkannt. Weiter mit Strg+Alt+Rechts.</p>
</section>
<script src="app.js"></script>
</body>
</html>
