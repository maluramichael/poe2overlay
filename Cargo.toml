[package]
name = "poe2overlay"
version = "0.1.0"
edition = "2021"
description = "Open-Source Ingame-Overlay für Path of Exile 2"
license = "MIT"

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
